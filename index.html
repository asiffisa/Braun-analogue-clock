<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Timeless is a Braun-inspired analogue clock for the web, with smooth time movement and a reusable React component." />
    <meta name="theme-color" content="#101110" />
    <title>Timeless — A wall clock for the web</title>
    <link rel="icon" href="/timeless%20favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/timeless%20favicon.png" />
    <!-- Link preview crawlers require public, absolute URLs. Keep this domain
         aligned with the production alias when the site URL changes. Give each
         future social cover a new, versioned filename: Telegram caches both
         page and image previews server-side and does not reliably re-fetch a
         replaced asset at the same URL. -->
    <link rel="canonical" href="https://timelessc.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://timelessc.vercel.app/" />
    <meta property="og:site_name" content="Timeless" />
    <meta property="og:title" content="Timeless — A wall clock for the web" />
    <meta property="og:description" content="A Braun-inspired analogue clock for the web, with smooth time movement and a reusable React component." />
    <meta property="og:image" content="https://timelessc.vercel.app/timeless-social-preview-20260806.png" />
    <meta property="og:image:secure_url" content="https://timelessc.vercel.app/timeless-social-preview-20260806.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="960" />
    <meta property="og:image:height" content="837" />
    <meta property="og:image:alt" content="Timeless logo and analogue clock on a plaster wall" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Timeless — A wall clock for the web" />
    <meta name="twitter:description" content="A Braun-inspired analogue clock for the web, with smooth time movement and a reusable React component." />
    <meta name="twitter:image" content="https://timelessc.vercel.app/timeless-social-preview-20260806.png" />
    <meta name="twitter:image:alt" content="Timeless logo and analogue clock on a plaster wall" />

    <!-- Preload hero LCP wall texture for faster initial paint -->
    <link rel="preload" as="image" href="/plaster-wall-morning-cropped.webp" fetchpriority="high" />

    <!-- The stylesheet is render-blocking; without these the font files then pay
         a fresh DNS + TLS handshake to a second origin before they can start. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
